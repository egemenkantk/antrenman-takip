# Sunucu fonksiyonlarının son kayıtlarını gösterir (sorun giderme için).
# Kayıtlarda şifre bulunmaz; telefon numaralarının yalnızca son 2 hanesi yazılır.

name: Sunucu kayıtları

on:
  workflow_dispatch:
    inputs:
      saat:
        description: 'Son kaç saatin kayıtları'
        default: '2'
      servis:
        description: 'Fonksiyon adı (küçük harf, örn. girisyap); boşsa hepsi'
        default: ''

permissions:
  contents: read

jobs:
  oku:
    runs-on: ubuntu-latest
    steps:
      - name: Kayıtları oku
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SERVIS: ${{ inputs.servis }}
          SAAT: ${{ inputs.saat }}
        run: |
          echo "$SA" > "$RUNNER_TEMP/sa.json"
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json" --quiet
          FILTRE='resource.type="cloud_run_revision"'
          if [ -n "$SERVIS" ]; then FILTRE="$FILTRE AND resource.labels.service_name=\"$SERVIS\""; fi
          gcloud logging read "$FILTRE" --freshness="${SAAT}h" --limit=40 \
            --project antrenman-takip-e6e4f --format=json \
            | jq -r '.[] | [.timestamp, .resource.labels.service_name, .severity, (.textPayload // (.jsonPayload|tostring) // (.httpRequest|tostring))] | @tsv'
          rm -f "$RUNNER_TEMP/sa.json"
