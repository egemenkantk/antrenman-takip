# Otomatik yayın
# - main dalına gelen her değişiklik → canlı site + sunucu fonksiyonları + Firestore kuralları
# - Pull request (önerilen değişiklik) → 7 gün geçerli test önizleme adresi
# Gerekli gizli anahtar: FIREBASE_SERVICE_ACCOUNT (depo ayarlarında, Actions secrets)

name: Yayın

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write
  checks: write

env:
  PROJE: antrenman-takip-e6e4f

jobs:
  derle-ve-yayinla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Bağımlılıkları kur
        run: |
          npm ci
          npm ci --prefix functions

      - name: Derle
        run: npm run build

      - name: Anahtar kontrolü
        id: anahtar
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "var=hayir" >> "$GITHUB_OUTPUT"
            echo "::warning::FIREBASE_SERVICE_ACCOUNT tanımlı değil; yayın atlandı."
          else
            echo "var=evet" >> "$GITHUB_OUTPUT"
          fi

      - name: Test önizlemesi (pull request)
        if: github.event_name == 'pull_request' && steps.anahtar.outputs.var == 'evet'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ env.PROJE }}
          expires: 7d

      - name: Kurallar ve sunucu fonksiyonları (main)
        if: github.event_name == 'push' && steps.anahtar.outputs.var == 'evet'
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json" --quiet
          gcloud services enable cloudbilling.googleapis.com cloudfunctions.googleapis.com \
            cloudbuild.googleapis.com artifactregistry.googleapis.com run.googleapis.com \
            eventarc.googleapis.com identitytoolkit.googleapis.com cloudscheduler.googleapis.com pubsub.googleapis.com --project "$PROJE" --quiet
          npx --yes firebase-tools@14 deploy --only firestore:rules,firestore:indexes,functions \
            --project "$PROJE" --non-interactive --force
          rm -f "$RUNNER_TEMP/sa.json"

      - name: Canlı siteyi yayınla (main)
        if: github.event_name == 'push' && steps.anahtar.outputs.var == 'evet'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ env.PROJE }}
          channelId: live
